<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roosia Pathology — Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── LOGIN SCREEN ────────────────────────────────────── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #C8102E 0%, #8b0c1f 100%);
    }

    .login-box {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      text-align: center;
    }

    .login-box .logo-mark {
      width: 56px; height: 56px;
      background: #C8102E;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px; color: #fff;
    }

    .login-box h2 { font-size: 22px; margin-bottom: 6px; }
    .login-box p  { color: #64748b; font-size: 14px; margin-bottom: 28px; }

    .login-box input {
      width: 100%; padding: 12px 16px;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 15px; font-family: inherit;
      margin-bottom: 14px; outline: none;
      transition: border-color 0.2s;
    }
    .login-box input:focus { border-color: #C8102E; }

    .login-box .login-btn {
      width: 100%; padding: 13px;
      background: #C8102E; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }
    .login-box .login-btn:hover { background: #a50d25; }
    #login-error {
      color: #C8102E; font-size: 13px;
      margin-top: 10px; display: none;
    }

    /* ── DASHBOARD ───────────────────────────────────────── */
    #dashboard { display: none; }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 32px;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }

    .topbar-brand {
      display: flex; align-items: center; gap: 12px;
      font-weight: 700; font-size: 18px; color: #C8102E;
    }

    .topbar-brand span { color: #1e293b; }

    .topbar-right {
      display: flex; align-items: center; gap: 16px;
    }

    .topbar-right .admin-tag {
      background: #fef2f2; color: #C8102E;
      padding: 4px 12px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
    }

    .logout-btn {
      background: none; border: 1.5px solid #e2e8f0;
      padding: 7px 16px; border-radius: 8px;
      font-size: 13px; cursor: pointer;
      color: #64748b; font-family: inherit;
      transition: all 0.2s;
    }
    .logout-btn:hover { border-color: #C8102E; color: #C8102E; }

    /* ── STATS BAR ───────────────────────────────────────── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 24px 32px 0;
    }

    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      border: 1px solid #e2e8f0;
    }

    .stat-card .stat-label {
      font-size: 13px; color: #64748b; margin-bottom: 6px;
    }

    .stat-card .stat-value {
      font-size: 28px; font-weight: 700; color: #1e293b;
    }

    .stat-card.pending  .stat-value { color: #d97706; }
    .stat-card.approved .stat-value { color: #16a34a; }
    .stat-card.rejected .stat-value { color: #C8102E; }

    /* ── MAIN CONTENT ────────────────────────────────────── */
    .main-content { padding: 24px 32px 48px; }

    .section-title {
      font-size: 18px; font-weight: 700;
      margin-bottom: 16px; color: #1e293b;
    }

    /* ── FILTERS ─────────────────────────────────────────── */
    .filters {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 20px; align-items: center;
    }

    .filter-btn {
      padding: 8px 18px;
      border: 1.5px solid #e2e8f0;
      background: #fff; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      transition: all 0.15s; color: #64748b;
    }

    .filter-btn:hover,
    .filter-btn.active { border-color: #C8102E; color: #C8102E; background: #fef2f2; }

    .search-box {
      margin-left: auto;
      padding: 8px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px; font-size: 13px;
      font-family: inherit; outline: none;
      width: 220px;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: #C8102E; }

    /* ── BOOKINGS TABLE ──────────────────────────────────── */
    .table-wrapper {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }

    table {
      width: 100%; border-collapse: collapse;
    }

    thead { background: #f8fafc; }
    thead th {
      padding: 13px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid #e2e8f0;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }

    tbody td {
      padding: 14px 16px;
      font-size: 14px;
      color: #374151;
      vertical-align: top;
    }

    .patient-name { font-weight: 600; color: #1e293b; }
    .patient-phone { font-size: 13px; color: #64748b; margin-top: 2px; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-pending  { background: #fef3c7; color: #92400e; }
    .badge-approved { background: #dcfce7; color: #166534; }
    .badge-rejected { background: #fee2e2; color: #991b1b; }

    .maps-link {
      color: #3b82f6; text-decoration: none;
      font-size: 13px; display: inline-flex;
      align-items: center; gap: 4px;
    }
    .maps-link:hover { text-decoration: underline; }

    .action-btns {
      display: flex; gap: 8px;
    }

    .btn-approve, .btn-reject {
      padding: 6px 14px;
      border: none; border-radius: 6px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }

    .btn-approve {
      background: #dcfce7; color: #166534;
    }
    .btn-approve:hover { background: #16a34a; color: #fff; }

    .btn-reject {
      background: #fee2e2; color: #991b1b;
    }
    .btn-reject:hover { background: #C8102E; color: #fff; }

    .btn-approve:disabled,
    .btn-reject:disabled {
      opacity: 0.4; cursor: not-allowed;
    }

    /* ── EMPTY / LOADING ─────────────────────────────────── */
    .table-empty {
      padding: 60px; text-align: center;
      color: #94a3b8; font-size: 15px;
    }
    .table-empty i { font-size: 36px; margin-bottom: 12px; display: block; }

    #loading-indicator {
      text-align: center; padding: 48px;
      color: #64748b; font-size: 15px;
    }
    #loading-indicator i { font-size: 24px; display: block; margin-bottom: 10px; }

    /* ── MODAL ───────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      max-width: 560px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-close {
      position: absolute; top: 16px; right: 20px;
      background: none; border: none;
      font-size: 22px; cursor: pointer; color: #94a3b8;
    }

    .modal-title {
      font-size: 18px; font-weight: 700;
      margin-bottom: 20px; padding-right: 30px;
    }

    .detail-row {
      display: grid; grid-template-columns: 140px 1fr;
      gap: 8px; padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #64748b; font-weight: 500; }
    .detail-value { color: #1e293b; word-break: break-word; }

    @media (max-width: 768px) {
      .stats-bar { grid-template-columns: repeat(2,1fr); padding: 16px; }
      .main-content { padding: 16px; }
      .topbar { padding: 0 16px; }
      .table-wrapper { overflow-x: auto; }
      table { min-width: 700px; }
    }
  </style>
</head>
<body>

  <!-- ── LOGIN SCREEN ──────────────────────────────────────── -->
  <div id="login-screen">
    <div class="login-box">
      <div class="logo-mark"><i class="fas fa-flask"></i></div>
      <h2>Admin Login</h2>
      <p>Roosia Pathology — Booking Management</p>
      <input type="password" id="admin-password" placeholder="Enter admin password">
      <button class="login-btn" id="login-btn">Login</button>
      <div id="login-error">Incorrect password. Please try again.</div>
    </div>
  </div>

  <!-- ── DASHBOARD ─────────────────────────────────────────── -->
  <div id="dashboard">

    <div class="topbar">
      <div class="topbar-brand">
        <i class="fas fa-flask"></i>
        <span>Roosia <span style="color:#C8102E">Pathology</span></span>
      </div>
      <div class="topbar-right">
        <span class="admin-tag"><i class="fas fa-shield-alt"></i> Admin</span>
        <button class="logout-btn" id="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Total Bookings</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card pending">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="stat-pending">—</div>
      </div>
      <div class="stat-card approved">
        <div class="stat-label">Approved</div>
        <div class="stat-value" id="stat-approved">—</div>
      </div>
      <div class="stat-card rejected">
        <div class="stat-label">Rejected</div>
        <div class="stat-value" id="stat-rejected">—</div>
      </div>
    </div>

    <div class="main-content">
      <div class="section-title">All Bookings</div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="approved">Approved</button>
        <button class="filter-btn" data-filter="rejected">Rejected</button>
        <input class="search-box" id="search-box" placeholder="Search name or phone…">
      </div>

      <div id="loading-indicator">
        <i class="fas fa-spinner fa-spin"></i>
        Loading bookings…
      </div>

      <div class="table-wrapper" id="table-wrapper" style="display:none;">
        <table>
          <thead>
            <tr>
              <th>Patient</th>
              <th>Tests</th>
              <th>Date / Time</th>
              <th>Collection</th>
              <th>Amount</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookings-tbody"></tbody>
        </table>
        <div id="table-empty" class="table-empty" style="display:none;">
          <i class="fas fa-inbox"></i>
          No bookings found.
        </div>
      </div>
    </div>

  </div>

  <!-- ── DETAIL MODAL ───────────────────────────────────────── -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal-box">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-title" id="modal-title">Booking Details</div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- ── FIREBASE SDK ───────────────────────────────────────── -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
  (function () {

    /* ── ADMIN PASSWORD ─────────────────────────────────── */
    /* Change this to your own password */
    var ADMIN_PASSWORD = 'roosia@admin2025';

    /* ── STATE ──────────────────────────────────────────── */
    var allBookings   = [];
    var activeFilter  = 'all';
    var searchQuery   = '';
    var unsubscribe   = null;

    /* ── LOGIN ──────────────────────────────────────────── */
    var loginScreen   = document.getElementById('login-screen');
    var dashboard     = document.getElementById('dashboard');
    var loginBtn      = document.getElementById('login-btn');
    var loginError    = document.getElementById('login-error');
    var logoutBtn     = document.getElementById('logout-btn');
    var pwInput       = document.getElementById('admin-password');

    function showDashboard() {
      loginScreen.style.display = 'none';
      dashboard.style.display   = 'block';
      startListening();
    }

    loginBtn.addEventListener('click', function () {
      if (pwInput.value === ADMIN_PASSWORD) {
        loginError.style.display = 'none';
        showDashboard();
      } else {
        loginError.style.display = 'block';
        pwInput.value = '';
        pwInput.focus();
      }
    });

    pwInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') loginBtn.click();
    });

    logoutBtn.addEventListener('click', function () {
      if (unsubscribe) unsubscribe();
      dashboard.style.display   = 'none';
      loginScreen.style.display = 'flex';
      pwInput.value = '';
    });

    /* ── REAL-TIME LISTENER ─────────────────────────────── */
    function startListening() {
      unsubscribe = window.listenToBookings(function (bookings) {
        allBookings = bookings;
        updateStats();
        renderTable();
        document.getElementById('loading-indicator').style.display = 'none';
        document.getElementById('table-wrapper').style.display     = 'block';
      });
    }

    /* ── STATS ──────────────────────────────────────────── */
    function updateStats() {
      var counts = { total: allBookings.length, pending: 0, approved: 0, rejected: 0 };
      allBookings.forEach(function (b) {
        if (b.bookingStatus === 'pending')  counts.pending++;
        if (b.bookingStatus === 'approved') counts.approved++;
        if (b.bookingStatus === 'rejected') counts.rejected++;
      });
      document.getElementById('stat-total').textContent    = counts.total;
      document.getElementById('stat-pending').textContent  = counts.pending;
      document.getElementById('stat-approved').textContent = counts.approved;
      document.getElementById('stat-rejected').textContent = counts.rejected;
    }

    /* ── FILTER + SEARCH ────────────────────────────────── */
    document.querySelectorAll('.filter-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
        this.classList.add('active');
        activeFilter = this.getAttribute('data-filter');
        renderTable();
      });
    });

    document.getElementById('search-box').addEventListener('input', function () {
      searchQuery = this.value.toLowerCase().trim();
      renderTable();
    });

    /* ── RENDER TABLE ───────────────────────────────────── */
    function renderTable() {
      var filtered = allBookings.filter(function (b) {
        var matchFilter = activeFilter === 'all' || b.bookingStatus === activeFilter;
        var matchSearch = !searchQuery
          || (b.patientName || '').toLowerCase().includes(searchQuery)
          || (b.phone       || '').toLowerCase().includes(searchQuery);
        return matchFilter && matchSearch;
      });

      var tbody     = document.getElementById('bookings-tbody');
      var emptyMsg  = document.getElementById('table-empty');

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      tbody.innerHTML = filtered.map(function (b) {
        var statusClass = {
          pending : 'badge-pending',
          approved: 'badge-approved',
          rejected: 'badge-rejected'
        }[b.bookingStatus] || 'badge-pending';

        var disabledAttr = (b.bookingStatus !== 'pending') ? 'disabled' : '';

        var createdStr = '';
        if (b.createdAt && b.createdAt.toDate) {
          createdStr = b.createdAt.toDate().toLocaleDateString('en-IN', {
            day: '2-digit', month: 'short', year: 'numeric'
          });
        }

        return '<tr>'
          + '<td>'
            + '<div class="patient-name">' + esc(b.patientName) + '</div>'
            + '<div class="patient-phone">' + esc(b.phone) + '</div>'
            + '<div style="font-size:12px;color:#94a3b8;margin-top:2px;">' + createdStr + '</div>'
          + '</td>'
          + '<td style="max-width:200px;font-size:13px;">' + esc(b.selectedTests) + '</td>'
          + '<td style="font-size:13px;white-space:nowrap;">'
            + esc(b.preferredDate) + '<br>'
            + '<span style="color:#64748b;">' + esc(b.preferredTime) + '</span>'
          + '</td>'
          + '<td style="font-size:13px;">' + esc(b.collectionType) + '</td>'
          + '<td style="font-size:13px;font-weight:600;">' + esc(b.totalAmount) + '</td>'
          + '<td>'
            + (b.googleMapsLink
              ? '<a class="maps-link" href="' + esc(b.googleMapsLink) + '" target="_blank"><i class="fas fa-map-marker-alt"></i> View Map</a>'
              : '—')
          + '</td>'
          + '<td><span class="badge ' + statusClass + '">' + esc(b.bookingStatus) + '</span></td>'
          + '<td>'
            + '<div class="action-btns">'
            + '<button class="btn-approve" ' + disabledAttr + ' onclick="handleAction(\'' + b.id + '\',\'approved\')">✓ Approve</button>'
            + '<button class="btn-reject"  ' + disabledAttr + ' onclick="handleAction(\'' + b.id + '\',\'rejected\')">✕ Reject</button>'
            + '</div>'
            + '<button onclick="showDetail(\'' + b.id + '\')" style="margin-top:6px;background:none;border:none;color:#3b82f6;font-size:12px;cursor:pointer;font-family:inherit;">View Details</button>'
          + '</td>'
          + '</tr>';
      }).join('');
    }

    /* ── APPROVE / REJECT ───────────────────────────────── */
    window.handleAction = function (docId, newStatus) {
      var label = newStatus === 'approved' ? 'Approve' : 'Reject';
      if (!confirm(label + ' this booking?')) return;

      window.updateBookingStatus(docId, newStatus).then(function (ok) {
        if (ok) {
          showMsg(newStatus === 'approved' ? 'Booking approved!' : 'Booking rejected.', newStatus);
        } else {
          alert('Failed to update status. Please try again.');
        }
      });
    };

    /* ── DETAIL MODAL ───────────────────────────────────── */
    window.showDetail = function (docId) {
      var b = allBookings.find(function (x) { return x.id === docId; });
      if (!b) return;

      document.getElementById('modal-title').textContent = 'Booking — ' + b.patientName;

      var rows = [
        ['Patient Name',   b.patientName],
        ['Phone',          b.phone],
        ['Email',          b.email || '—'],
        ['Address',        b.address],
        ['Booking For',    b.bookingFor],
        ['Selected Tests', b.selectedTests],
        ['Category',       b.testCategory],
        ['Notes',          b.notes],
        ['Date',           b.preferredDate],
        ['Time',           b.preferredTime],
        ['Collection',     b.collectionType],
        ['Payment',        b.paymentMethod],
        ['Tests Total',    b.testsTotal],
        ['Home Charge',    b.homeCharge],
        ['Grand Total',    b.totalAmount],
        ['Distance',       b.distanceFromLab],
        ['Status',         b.bookingStatus],
        ['Maps Link',      b.googleMapsLink
          ? '<a href="' + esc(b.googleMapsLink) + '" target="_blank" style="color:#3b82f6;">Open in Maps</a>'
          : '—']
      ];

      document.getElementById('modal-body').innerHTML = rows.map(function (r) {
        return '<div class="detail-row">'
          + '<div class="detail-label">' + r[0] + '</div>'
          + '<div class="detail-value">' + (r[1] || '—') + '</div>'
          + '</div>';
      }).join('');

      document.getElementById('detail-modal').classList.add('open');
    };

    document.getElementById('modal-close').addEventListener('click', function () {
      document.getElementById('detail-modal').classList.remove('open');
    });

    document.getElementById('detail-modal').addEventListener('click', function (e) {
      if (e.target === this) this.classList.remove('open');
    });

    /* ── STATUS TOAST ───────────────────────────────────── */
    function showMsg(msg, type) {
      var t = document.createElement('div');
      t.style.cssText = 'position:fixed;bottom:24px;right:24px;padding:14px 20px;'
        + 'background:' + (type === 'approved' ? '#16a34a' : '#C8102E') + ';'
        + 'color:#fff;border-radius:10px;font-size:14px;font-weight:600;'
        + 'z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.2);'
        + 'transition:opacity 0.3s;opacity:0;';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function () { t.style.opacity = '1'; }, 10);
      setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 300); }, 3000);
    }

    /* ── ESCAPE HTML ────────────────────────────────────── */
    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

  })();
  </script>

</body>
</html>
